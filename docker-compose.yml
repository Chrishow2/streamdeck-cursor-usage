services:
  build:
    build: .
    volumes:
      - ./:/app
      - cursor_usage_node_modules:/app/node_modules
    environment:
      STREAMDECK_RESTART: "0"
    command: sh -c "npm install && npm run build"

  watch:
    build: .
    volumes:
      - ./:/app
      - cursor_usage_node_modules:/app/node_modules
    environment:
      STREAMDECK_RESTART: "0"
    command: sh -c "npm install && npm run watch"

volumes:
  cursor_usage_node_modules:
