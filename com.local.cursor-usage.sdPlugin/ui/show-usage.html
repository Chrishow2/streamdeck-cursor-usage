<!doctype html>
<html lang="en">
	<head>
		<title>Show Usage Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<script src="./locale.js"></script>
	</head>

	<body>
		<sdpi-item label="__MSG_refreshSeconds__">
			<sdpi-range setting="refreshSeconds" min="30" max="600" step="30" default="120" showlabels></sdpi-range>
		</sdpi-item>

		<sdpi-item label="__MSG_accessToken__">
			<sdpi-password setting="accessToken" placeholder="__MSG_accessTokenPlaceholder__"></sdpi-password>
		</sdpi-item>

		<sdpi-item label="__MSG_useMock__">
			<sdpi-checkbox setting="useMock" default="false">__MSG_useMockHint__</sdpi-checkbox>
		</sdpi-item>
	</body>
</html>
