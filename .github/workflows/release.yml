name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin
        run: docker compose run --rm build

      - name: Package .streamDeckPlugin
        run: |
          zip -r "com.local.cursor-usage.streamDeckPlugin" "com.local.cursor-usage.sdPlugin"
          test -f "com.local.cursor-usage.sdPlugin/bin/plugin.js"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: com.local.cursor-usage.streamDeckPlugin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
